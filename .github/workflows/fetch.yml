name: Twitch Archive Fetcher

on:
  schedule:
    # YouTube(毎時0分) / Kick(毎時0分) とずらして毎時30分に実行
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を防ぐ (cron と mokou-timeline からの起動が重なったときに、
# 両者が twitch_archives.json を書いて push で衝突するのを避ける)。
concurrency:
  group: twitch-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Twitch archives
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python twitch_archiver.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitch_archives.json
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "Update Twitch archives [skip ci]"
          git pull --rebase
          git push
